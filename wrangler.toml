name = "maple-grove-front-desk"
main = "backend/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The React app is served as static assets; /api/* always hits the Worker first.
[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Non-secret config. OPENROUTER_API_KEY is a secret (.dev.vars locally).
[vars]
OPENROUTER_MODEL = "openai/gpt-6.1-sol"
ROUTER = "jev"

# database_id is a placeholder until the first deploy (`wrangler d1 create maple-grove`).
# Local dev (`npm run dev`) uses a local SQLite file and ignores it.
[[d1_databases]]
binding = "DB"
database_name = "maple-grove"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "backend/migrations"
