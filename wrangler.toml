name = "maple-grove-front-desk"
main = "backend/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The React app is served as static assets; /api/* always hits the Worker first.
[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Non-secret config. OPENROUTER_API_KEY is a secret (.dev.vars locally).
[vars]
CHAT_COMPLETION_MODEL = "openai/gpt-6.1-sol"
ROUTER = "jev"
ROUTER_MODEL = "typesafe/jev-1.14"

# ~20 chat messages per minute per IP, so a public URL can't run up a bill.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Production database (created with `wrangler d1 create maple-grove`).
# Local dev (`npm run dev`) uses a local SQLite file and ignores database_id.
[[d1_databases]]
binding = "DB"
database_name = "maple-grove"
database_id = "af9cdd9c-2a81-4b2d-9f44-1b5be825394a"
migrations_dir = "backend/migrations"
